name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: menny/android

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        run: |
          echo "Setting up JDK"
          # Additional setup commands if necessary

      - name: Build APK
        run: |
          gradlew assembleDebug
