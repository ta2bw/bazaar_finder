name: Generated APK AAB (Push Github - Create Artifact To Github Action)

env:
  # The name of the main module repository
  main_project_module: app

  # The name of the Play Store
  playstore_name: Frogobox ID

  # The output folder for build results
  build_output_path: buildActionResult

on:

  push:
    branches:
      - 'release/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '$' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Run Tests Build
      - name: Run gradle tests
        run: ./gradlew test

      # Run Build Project
      - name: Build gradle project
        run: ./gradlew build

      # Create APK Debug
      - name: Build apk debug project (APK) - $ module
        run: ./gradlew assembleDebug

      # Create APK Release
      - name: Build apk release project (APK) - $ module
        run: ./gradlew assemble

      # Create Bundle AAB Release
      # Noted for main module build [main_project_module]:bundleRelease
      - name: Build app bundle release (AAB) - $ module
        run: ./gradlew $:bundleRelease

      # Upload Artifact Build
      # Noted For Output [main_project_module]/build/outputs/apk/debug/
      - name: Upload APK Debug - $
        uses: actions/upload-artifact@v4
        with:
          name: $ - $ - $ - APK(s) debug generated
          path: $/build/outputs/apk/debug/

      # Noted For Output [main_project_module]/build/outputs/apk/release/
      - name: Upload APK Release - $
        uses: actions/upload-artifact@v4
        with:
          name: $ - $ - $ - APK(s) release generated
          path: $/build/outputs/apk/release/

      # Noted For Output [main_project_module]/build/outputs/bundle/release/
      - name: Upload AAB (App Bundle) Release - $
        uses: actions/upload-artifact@v4
        with:
          name: $ - $ - $ - App bundle(s) AAB release generated
          path: $/build/outputs/bundle/release/

      # ======================================================
      # Copy Build Outputs & Push to GitHub
      # ======================================================

      # Delete build/outputs directory if it already exists
      - name: Clean up build/outputs directory
        run: rm -rf $

      # Create build/outputs directory if it doesn't exist
      - name: Create build/outputs directory
        run: mkdir -p $

      # Copy APK Debug to build/outputs
      - name: Copy APK Debug to build/outputs
        run: |
          cp -r $/build/outputs/apk/debug/* $/ 2>/dev/null || echo "No APK debug files found"

      # Copy APK Release to build/outputs
      - name: Copy APK Release to build/outputs
        run: |
          cp -r $/build/outputs/apk/release/* $/ 2>/dev/null || echo "No APK release files found"

      # Copy AAB Release to build/outputs
      - name: Copy AAB Release to build/outputs
        run: |
          cp -r $/build/outputs/bundle/release/* $/ 2>/dev/null || echo "No AAB release files found"

      # List copied files for verification
      - name: List build/outputs contents
        run: ls -la $/

      # Commit and Push to GitHub
      - name: Commit & Push build outputs to GitHub
        run: |
          git config user.name '$'
          git config user.email '$@users.noreply.github.com'
          git add $/ -f
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "ci: upload build outputs - $ [skip ci]" && git push)
